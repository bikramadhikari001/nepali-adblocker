<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nepali Adblocker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <span class="logo">🛡️</span>
        <span class="title">Nepali Adblocker</span>
      </div>
      <button id="power-btn" class="power-btn active" title="Toggle ad blocking">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 2v10"/>
          <path d="M18.36 6.64A9 9 0 1 1 5.64 6.64"/>
        </svg>
      </button>
    </div>

    <!-- Stats -->
    <div class="stats-section">
      <div class="stat">
        <span class="stat-number" id="tab-count">0</span>
        <span class="stat-label">blocked on this page</span>
      </div>
      <div class="stat">
        <span class="stat-number" id="total-count">0</span>
        <span class="stat-label">blocked total</span>
      </div>
    </div>

    <!-- Current site -->
    <div class="site-section">
      <div class="site-info">
        <span class="site-domain" id="site-domain">—</span>
      </div>
      <button id="whitelist-btn" class="whitelist-btn" title="Toggle whitelist for this site">
        <span class="whitelist-icon">✓</span>
        <span class="whitelist-text">Whitelist</span>
      </button>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button id="options-btn" class="action-btn" title="Open dashboard">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        Dashboard
      </button>
    </div>
  </div>
  <script type="module" src="popup.ts"></script>
</body>
</html>
